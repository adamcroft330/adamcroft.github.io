<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Cottage Kitchen · Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <span class="head-brand">Garden Cottage Kitchen</span>
    <button class="lang-toggle" id="langToggle" type="button">中文</button>
  </div>
</header>

<div class="layout">
  <aside class="cat-sidebar" id="catSidebar"></aside>
  <section class="food-list" id="foodList"></section>
</div>

<button class="fab" id="fabAdd" type="button" aria-label="Add a dish"><span>✚</span></button>

<!-- ============ SHEETS ============ -->

<div class="sheet-mask" id="mask" hidden></div>

<div class="sheet" id="shareSheet" hidden>
  <div class="sheet-grip"></div>
  <h3 class="sheet-title" data-i18n="shareTitle">Add a dish to the garden menu</h3>
  <label class="photo-pick" id="photoPick">
    <span class="photo-plus" id="photoPlus">✚</span>
    <img id="preview" class="photo-preview" alt="" hidden>
    <span class="photo-hint" id="photoHint" data-i18n="photoHint">Tap to choose a photo</span>
  </label>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="text" id="nameInput" class="dish-input" data-i18n-placeholder="dishNamePlaceholder" maxlength="30">
  <div class="cuisine-pick">
    <span class="cuisine-pick-label" data-i18n="cuisineLabel">Cuisine</span>
    <select id="cuisineSelect" class="cuisine-select">
      <option value="">Auto · AI</option>
    </select>
  </div>
  <button class="sheet-add" id="addBtn" type="button" data-i18n="addToMenu" disabled>Add to Menu</button>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
