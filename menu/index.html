        <circle cx="76" cy="37" r="6.5" fill="#fbfefc"/>

<div class="layout">
  <aside class="sidebar">
    <h2 class="sidebar-title" data-i18n="cuisines">菜 系</h2>
    <ul class="cuisine-list" id="cuisineList"></ul>
    <button class="ai-btn" id="aiBtn" type="button" data-i18n="aiClassify">AI 分 類</button>
    <button class="ai-btn" id="syncBtn" type="button" data-i18n="syncLocal" hidden>上 傳 本 機 菜 單</button>
    <p class="ai-status" id="aiStatus" hidden></p>
    <svg class="illus-witch" viewBox="0 0 100 120" aria-hidden="true">
      <path d="M50 6 L63 46 L37 46 Z" fill="#5a8fb0"/>

      <path d="M26 10 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 Z" fill="#b8d8c9"/>
    </svg>
  </aside>

  <main class="main">
    <section class="upload-panel" id="uploadPanel">
      <label class="upload-btn" for="fileInput">
        <span class="upload-plus">✚</span>
        <span class="upload-text" data-i18n="upload">添 一 道 菜</span>
      </label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <img id="preview" class="upload-preview" alt="">
      <input type="text" id="nameInput" class="name-input" data-i18n-placeholder="namePlaceholder" maxlength="30">
      <button class="add-btn" id="addBtn" data-i18n="add" disabled>入 册</button>
    </section>

    <section class="menu" id="menu" aria-live="polite">

            <path d="M39 74 L27 82 M61 74 L73 82" stroke="#7fbf8a" stroke-width="5" stroke-linecap="round"/>

            <path d="M50 60 L66 92" stroke="#33423c" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
          <g transform="translate(96 62) scale(1.05)">
            <ellipse cx="60" cy="70" rx="34" ry="26" fill="#7fbf8a"/>

            <circle cx="44" cy="37" r="3.2" fill="#33423c"/>

            <path d="M48 66 Q 60 74 72 66" stroke="#33423c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="37" cy="66" r="3" fill="#eccd6b" opacity="0.8"/>
