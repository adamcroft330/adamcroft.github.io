<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Themis Control-Stack Quad</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace;font-weight:300;background:#0a0a0a;color:rgba(255,255,255,0.92);margin:0;overflow:hidden}
#c{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#s{position:fixed;top:0;right:0;width:300px;height:100%;z-index:10;background:rgba(10,10,10,0.95);border-left:1px solid rgba(255,255,255,0.08);overflow-y:auto;padding:16px}
#h{position:fixed;top:0;left:0;z-index:5;padding:12px 20px;background:linear-gradient(to bottom,rgba(10,10,10,0.95) 60%,transparent);width:calc(100% - 300px)}
.p{padding:5px 8px;margin:1px 0;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;font-size:12px;user-select:none}
.p:hover{background:rgba(255,255,255,0.05)}
.p.a{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.cd{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.15)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0}
.sb{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:6px 8px;text-align:center}
.sv{font-size:14px;color:#fff}
.sl{font-size:9px;color:#666;margin-top:1px}
#lo{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0a0a0a;flex-direction:column;gap:12px}
#sp{width:32px;height:32px;border:2px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#er{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(200,50,50,0.85);padding:6px 14px;border-radius:4px;font-size:11px;display:none;white-space:nowrap}
#ruler{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:40;pointer-events:none;display:none;width:320px}
#ruler .bar{position:relative;height:16px}
#ruler .tick{position:absolute;bottom:0;width:1px;background:#aaa}
#ruler .tick.m{background:#eee;height:7px}
#ruler .lbl{position:absolute;bottom:-14px;transform:translateX(-50%);color:#aaa;font-size:9px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
@media(max-width:768px){
#s{width:100%;height:40%;top:auto;bottom:0;border-left:none;border-top:1px solid rgba(255,255,255,0.08);padding:10px}
#h{width:100%}
}
</style>
</head>
<body>
<div id="lo"><div id="sp"></div><div style="font-size:12px;color:#666">Loading 3D models…</div></div>
    <div id="er"></div>
    <div id="ruler"><div class="bar" id="ruler-bar"></div></div>
    <a href="/" style="position:fixed;top:12px;left:12px;z-index:20;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);padding:6px 12px;border-radius:4px;color:#aaa;text-decoration:none;font-size:12px">← Back</a>
<div id="h">
<div style="font-size:16px;font-family:'Space Grotesk',sans-serif;font-weight:300">Themis Control-Stack Quad</div>
    <div style="font-size:11px;color:#666;margin-top:2px"><span id="pc">0</span> components · 381g AUW · TWR 3.25:1 · 250mm cube</div>
</div>
<div id="c"></div>
<div id="s">
        <div class="sg">
            <div class="sb"><div class="sv">$690</div><div class="sl">EST. BOM</div></div>
            <div class="sb"><div class="sv">3.25:1</div><div class="sl">TWR</div></div>
            <div class="sb"><div class="sv">250×110mm</div><div class="sl">ENVELOPE</div></div>
            <div class="sb"><div class="sv">381g</div><div class="sl">AUW</div></div>
        </div>
<div style="font-size:10px;color:#555;display:flex;justify-content:space-between;margin:10px 0 6px">
<span>Parts (<span id="vc">0</span>/<span id="tc">0</span>)</span>
<span style="cursor:pointer;color:#888" onclick="ta()" id="tab">Hide All</span>
</div>
<div id="pl"></div>
</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
}
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const PARTS=[
{file:'models/plate.stl',name:'Custom Frame Plate (PETG)',w:'55g',c:0x606060},
{file:'models/esc.stl',name:'4-in-1 35A ESC',w:'7g',c:0xD4A017},
{file:'models/pixhawk.stl',name:'Pixhawk 6C Mini',w:'42g',c:0x2E7D32},
{file:'models/cm5.stl',name:'CM5 + Waveshare Nano B',w:'30g',c:0x1565C0},
{file:'models/cam.stl',name:'Mightycam',w:'10g',c:0x212121},
{file:'models/motor.stl',name:'1806 Motor x4',w:'82g',c:0x9E9E9E},
{file:'models/prop.stl',name:'4" Propeller x4',w:'12g',c:0x424242},
{file:'models/guard.stl',name:'TPU Prop Guard x4',w:'20g',c:0xE65100},
];

const container=document.getElementById('c');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0a);

const camera=new THREE.PerspectiveCamera(30,container.clientWidth/container.clientHeight,1,2000);
camera.position.set(260,140,260);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,12,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=80;controls.maxDistance=600;controls.update();

scene.add(new THREE.AmbientLight(0xffffff,1.8));
const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(150,200,150);scene.add(dl);
const d2=new THREE.DirectionalLight(0xffffff,1.5);d2.position.set(-150,100,-150);scene.add(d2);
const d3=new THREE.DirectionalLight(0xffffff,1.5);d3.position.set(-150,200,150);scene.add(d3);
const d4=new THREE.DirectionalLight(0xffffff,1.5);d4.position.set(150,100,-150);scene.add(d4);
const d5=new THREE.DirectionalLight(0xffffff,1.0);d5.position.set(0,-100,0);scene.add(d5);

const grid=new THREE.GridHelper(500,30,0x444444,0x333333);grid.position.y=-30;scene.add(grid);

// Screen-anchored ruler removed — replaced by HTML overlay below

const bbox=new THREE.BoxGeometry(250,250,250);
const bframe=new THREE.LineSegments(new THREE.EdgesGeometry(bbox),new THREE.LineBasicMaterial({color:0xff3333,transparent:true,opacity:0.15}));
bframe.position.set(0,12,0);scene.add(bframe);

const loader=new STLLoader();
const meshes=[];
let loaded=0;

function showError(msg){
const el=document.getElementById('er');el.textContent=msg;el.style.display='block';
setTimeout(()=>{el.style.display='none'},8000);
}

PARTS.forEach((p,i)=>{
loader.load(p.file,(geom)=>{
geom.computeVertexNormals();
const mat=new THREE.MeshPhysicalMaterial({color:p.c,metalness:0.1,roughness:0.5,clearcoat:0.05});
const mesh=new THREE.Mesh(geom,mat);
mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData={idx:i,vis:true};
scene.add(mesh);meshes[i]=mesh;loaded++;
document.getElementById('pc').textContent=PARTS.length;updateUI();
if(loaded===PARTS.length)document.getElementById('lo').style.display='none';
},null,(err)=>{showError('Failed: '+p.file);loaded++;if(loaded===PARTS.length)document.getElementById('lo').style.display='none'});
});

const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('click',(e)=>{
const rect=renderer.domElement.getBoundingClientRect();
pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
raycaster.setFromCamera(pointer,camera);
const hits=raycaster.intersectObjects(scene.children);
if(hits.length>0&&hits[0].object.userData&&hits[0].object.userData.idx!==undefined){highlight(hits[0].object.userData.idx);return}
highlight(-1);
});

function highlight(idx){
meshes.forEach(m=>{if(m&&m.material.emissive)m.material.emissive.setHex(0)});
document.querySelectorAll('.p').forEach(el=>el.classList.remove('a'));
if(idx>=0&&meshes[idx]){
meshes[idx].material.emissive.setHex(0x4444ff);
const item=document.querySelector(`[data-i="${idx}"]`);
if(item){item.classList.add('a');item.scrollIntoView({block:'nearest',behavior:'smooth'})};
}
}

window.tp=function(idx){
const mesh=meshes[idx];if(!mesh)return;
mesh.visible=!mesh.visible;mesh.userData.vis=mesh.visible;
const item=document.querySelector(`[data-i="${idx}"]`);
if(item)item.style.opacity=mesh.visible?1:0.3;
updateUI();
};
window.ta=function(){
const any=meshes.some(m=>m&&m.userData.vis);
meshes.forEach(m=>{if(m){m.visible=!any;m.userData.vis=!any}});
document.querySelectorAll('.p').forEach(el=>el.style.opacity=any?0.3:1);
document.getElementById('tab').textContent=any?'Show All':'Hide All';
updateUI();
};
function updateUI(){
const v=meshes.filter(m=>m&&m.userData.vis).length;
const t=meshes.filter(m=>m).length;
document.getElementById('vc').textContent=v;document.getElementById('tc').textContent=t;
document.getElementById('tab').textContent=v===t?'Hide All':'Show All';
}

// Build parts list
const pl=document.getElementById('pl');
PARTS.forEach((p,i)=>{
const d=document.createElement('div');d.className='p';d.setAttribute('data-i',i);
d.innerHTML='<span class="cd" style="background:#'+p.c.toString(16).padStart(6,'0')+'"></span><span style="flex:1;font-size:12px">'+p.name+'</span><span style="font-size:10px;color:#666">'+p.w+'</span>';
d.onclick=()=>{highlight(i);tp(i)};
pl.appendChild(d);
});
document.getElementById('tc').textContent=PARTS.length;document.getElementById('vc').textContent=PARTS.length;

// Static CSS scale ruler — reference bar, not dynamically scaled
const rulerEl=document.getElementById('ruler');
const rulerBar=document.getElementById('ruler-bar');
rulerBar.innerHTML='';
for(let mm=0; mm<=250; mm+=12.5){
    const t=document.createElement('div');
    t.className='tick'+(mm%50===0?' m':'');
    t.style.left=(mm/250*100)+'%';
    t.style.height=mm%50===0?7:(mm%25===0?5:3)+'px';
    t.style.width=mm%50===0?2:1;
    rulerBar.appendChild(t);
}
for(let mm=0; mm<=250; mm+=50){
    const l=document.createElement('div');
    l.className='lbl';
    l.style.left=(mm/250*100)+'%';
    l.textContent=mm;
    rulerBar.appendChild(l);
}
rulerEl.style.display='block';

function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}
anim();
</script>
</body>
</html>
