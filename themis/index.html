<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Themis Control-Stack Quad</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">
<style>
body{font-family:'JetBrains Mono',monospace;font-weight:300;background:#0a0a0a;color:rgba(255,255,255,0.92);margin:0;overflow:hidden;font-size:14px}
#c{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#s{position:fixed;top:0;right:0;width:320px;height:100%;z-index:10;background:rgba(10,10,10,0.95);border-left:1px solid rgba(255,255,255,0.08);overflow-y:auto;padding:16px}
#h{position:fixed;top:0;left:0;z-index:5;padding:12px 20px;background:linear-gradient(to bottom,rgba(10,10,10,0.95) 60%,transparent);width:calc(100% - 320px)}
.p{padding:6px 10px;margin:1px 0;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid transparent;font-size:12px}
.p:hover{background:rgba(255,255,255,0.05)}
.p.a{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.cd{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.15)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0}
.sb{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:6px 8px;text-align:center}
.sv{font-size:14px;font-weight:400;color:#fff}
.sl{font-size:9px;color:#666;margin-top:1px}
#lo{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0a0a0a;flex-direction:column;gap:12px}
#sp{width:32px;height:32px;border:2px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#er{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(200,50,50,0.85);padding:6px 14px;border-radius:4px;font-size:11px;display:none}
@media(max-width:768px){
#s{width:100%;height:45%;top:auto;bottom:0;border-left:none;border-top:1px solid rgba(255,255,255,0.08);padding:10px}
#h{width:100%}
}
</style>
</head>
<body>
<div id="lo"><div id="sp"></div><div style="font-size:12px;color:#666">Loading 3D models…</div></div>
<div id="er"></div>
<a href="/" style="position:fixed;top:12px;left:12px;z-index:20;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);padding:6px 12px;border-radius:4px;color:#aaa;text-decoration:none;font-size:12px">← Back</a>
<div id="h">
<div style="font-size:16px;font-family:'Space Grotesk',sans-serif;font-weight:300">Themis Control-Stack Quad</div>
<div style="font-size:11px;color:#666;margin-top:2px"><span id="pc">0</span> components · <span id="tw">454</span>g AUW · TWR 2.73:1 · 250mm cube</div>
</div>
<div id="c"></div>
<div id="s">
<div class="sg">
<div class="sb"><div class="sv">$690</div><div class="sl">EST. BOM</div></div>
<div class="sb"><div class="sv">2.73:1</div><div class="sl">TWR</div></div>
<div class="sb"><div class="sv">238×110mm</div><div class="sl">ENVELOPE</div></div>
<div class="sb"><div class="sv">454g</div><div class="sl">AUW</div></div>
</div>
<div style="font-size:10px;color:#555;display:flex;justify-content:space-between;margin:10px 0 6px">
<span>Parts (<span id="vc">0</span>/<span id="tc">0</span>)</span>
<span style="cursor:pointer" onclick="ta()" id="tab">Hide All</span>
</div>
<div id="pl"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// STL Loader for r128
THREE.STLLoader=function(m){this.manager=m||THREE.DefaultLoadingManager};
THREE.STLLoader.prototype={constructor:THREE.STLLoader,
load:function(u,ok,pr,er){var t=this;new THREE.FileLoader(this.manager).setResponseType('arraybuffer').load(u,function(d){ok(t.parse(d))},pr,er)},
parse:function(d){var r=new DataView(d),fs=(32/8*3)+((32/8*3)*3)+(16/8),nf=r.getUint32(80,1),ex=80+(32/8)+(nf*fs);
if(ex===r.byteLength)return this.parseBinary(d);
var s=[0x73,0x6f,0x6c,0x69,0x64],bin=0;for(var i=0;i<5;i++)if(r.getUint8(i)!==s[i])bin=1;
return bin?this.parseBinary(d):this.parseASCII(function(d){var s='',a=new Uint8Array(d);for(var i=0;i<d.byteLength;i++)s+=String.fromCharCode(a[i]);return s}(d));},
parseBinary:function(d){var r=new DataView(d),nf=r.getUint32(80,1),v=[],n=[],ii=[],fi=0;
for(var i=0;i<nf;i++){var st=84+i*50,nx=r.getFloat32(st,1),ny=r.getFloat32(st+4,1),nz=r.getFloat32(st+8,1);
for(var j=0;j<3;j++){var sv=st+12+j*12;v.push(r.getFloat32(sv,1),r.getFloat32(sv+4,1),r.getFloat32(sv+8,1));n.push(nx,ny,nz)}
ii.push(fi,fi+1,fi+2);fi+=3}
var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(n,3));g.setIndex(ii);return g},
parseASCII:function(d){var ls=d.split('\n'),v=[],n=[],ii=[],fi=0;
for(var i=0;i<ls.length;i++){var l=ls[i].trim();
if(l.indexOf('facet normal')===0){var p=l.split(' '),nx=parseFloat(p[2]),ny=parseFloat(p[3]),nz=parseFloat(p[4]);
for(var j=0;j<3;j++){i++;while(i<ls.length&&ls[i].trim().indexOf('vertex')!==0)i++;if(i>=ls.length)break;
var vp=ls[i].trim().split(' ');v.push(parseFloat(vp[1]),parseFloat(vp[2]),parseFloat(vp[3]));n.push(nx,ny,nz)}
ii.push(fi,fi+1,fi+2);fi+=3}}
var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(n,3));g.setIndex(ii);return g}};
</script>
<script>
const PARTS=[
{file:'models/frame.stl',name:'Chimera4 LR Frame',w:'61g',c:0x606060},
{file:'models/esc.stl',name:'4-in-1 35A ESC',w:'7g',c:0xD4A017},
{file:'models/pixhawk.stl',name:'Pixhawk 6C Mini',w:'42g',c:0x2E7D32},
{file:'models/cm5.stl',name:'CM5 + Waveshare Nano B',w:'30g',c:0x1565C0},
{file:'models/hailo.stl',name:'Hailo-8L + PCIe Adapter',w:'10g',c:0x1B5E20},
{file:'models/mightycam.stl',name:'Mightycam',w:'10g',c:0x212121},
{file:'models/sensors.stl',name:'Sensors (ToF+UWB+ELRS)',w:'8g',c:0x8E24AA},
{file:'models/motor.stl',name:'1806 Motor x4',w:'82g',c:0x9E9E9E},
{file:'models/prop.stl',name:'4" Propeller x4',w:'12g',c:0x424242},
{file:'models/guard.stl',name:'TPU Prop Guard x4',w:'20g',c:0xE65100},
{file:'models/battery.stl',name:'4S 1100mAh LiPo',w:'100g',c:0xB71C1C},
{file:'models/pm06.stl',name:'PM06 Power Module',w:'12g',c:0xE53935},
{file:'models/ubec.stl',name:'5V/5A UBEC',w:'5g',c:0x212121},
];

const c=document.getElementById('c');
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0a0a);
const cam=new THREE.PerspectiveCamera(35,c.clientWidth/c.clientHeight,1,2000);cam.position.set(240,170,280);
const r=new THREE.WebGLRenderer({antialias:1});r.setSize(c.clientWidth,c.clientHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));r.shadowMap.enabled=1;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.2;c.appendChild(r.domElement);
var ct=new THREE.OrbitControls(cam,r.domElement);ct.target.set(0,40,0);ct.enableDamping=1;ct.dampingFactor=.08;ct.minDistance=80;ct.maxDistance=600;ct.update();
sc.add(new THREE.AmbientLight(0x404060,.6));
var dl=new THREE.DirectionalLight(0xffffff,2.5);dl.position.set(200,300,200);dl.castShadow=1;sc.add(dl);
var fl=new THREE.DirectionalLight(0x8888ff,.8);fl.position.set(-150,100,-200);sc.add(fl);
sc.add(new THREE.DirectionalLight(0xffffff,.5).position.set(0,-100,200));
sc.add(new THREE.HemisphereLight(0x8888ff,0x444422,.5));
var g=new THREE.GridHelper(500,30,0x333333,0x222222);g.position.y=-30;sc.add(g);
var bg=new THREE.BoxGeometry(250,250,250);var bw=new THREE.LineSegments(new THREE.EdgesGeometry(bg),new THREE.LineBasicMaterial({color:0xff3333,transparent:1,opacity:.15}));bw.position.set(0,95,0);sc.add(bw);

var ld=new THREE.STLLoader(),ms=[],lc=0;
function se(m){var e=document.getElementById('er');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},8000)}

PARTS.forEach(function(p,i){
ld.load(p.file,function(g){
g.computeVertexNormals();
var m=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:p.c,shininess:40,specular:0x222222}));
m.castShadow=1;m.receiveShadow=1;m.userData={idx:i,v:1};
g.computeBoundingBox();var bb=g.boundingBox;var ct2=new THREE.Vector3();bb.getCenter(ct2);m.position.sub(ct2);
sc.add(m);ms[i]=m;lc++;
document.getElementById('pc').textContent=PARTS.length;ui();
if(lc===PARTS.length)document.getElementById('lo').style.display='none';
},null,function(){se('Failed: '+p.file);lc++;if(lc===PARTS.length)document.getElementById('lo').style.display='none'});
});

var rc=new THREE.Raycaster(),pt=new THREE.Vector2(),si=-1;
r.domElement.addEventListener('click',function(e){
var rect=r.domElement.getBoundingClientRect();
pt.x=((e.clientX-rect.left)/rect.width)*2-1;pt.y=-((e.clientY-rect.top)/rect.height)*2+1;
rc.setFromCamera(pt,cam);var hi=rc.intersectObjects(sc.children);
if(hi.length>0&&hi[0].object.userData&&hi[0].object.userData.idx!==undefined){hl(hi[0].object.userData.idx);return}
hl(-1);
});

function hl(i){
ms.forEach(function(m){if(m)m.material.emissive&&m.material.emissive.setHex(0)});
document.querySelectorAll('.p').forEach(function(e){e.classList.remove('a')});
if(i>=0&&ms[i]){ms[i].material.emissive.setHex(0x4444ff);var it=document.querySelector('[data-i="'+i+'"]');if(it){it.classList.add('a');it.scrollIntoView({block:'nearest',behavior:'smooth'})}si=i}else si=-1;
}

window.tp=function(i){var m=ms[i];if(!m)return;m.visible=!m.visible;m.userData.v=m.visible;
var it=document.querySelector('[data-i="'+i+'"]');if(it)it.style.opacity=m.visible?1:.3;ui()};
window.ta=function(){var av=0;ms.forEach(function(m){if(m&&m.userData.v)av=1});
ms.forEach(function(m){if(m){m.visible=!av;m.userData.v=!av}});
document.querySelectorAll('.p').forEach(function(e){e.style.opacity=av?.3:1});
document.getElementById('tab').textContent=av?'Show All':'Hide All';ui()};
function ui(){var v=ms.filter(function(m){return m&&m.userData.v}).length,t=ms.filter(function(m){return m}).length;
document.getElementById('vc').textContent=v;document.getElementById('tc').textContent=t;
document.getElementById('tab').textContent=v===t?'Hide All':'Show All'}

// Build parts list
var pl=document.getElementById('pl');
PARTS.forEach(function(p,i){
var d=document.createElement('div');d.className='p';d.setAttribute('data-i',i);
d.innerHTML='<span class="cd" style="background:#'+p.c.toString(16).padStart(6,'0')+'"></span><span style="flex:1;font-size:12px">'+p.name+'</span><span style="font-size:10px;color:#666">'+p.w+'</span>';
d.onclick=function(){hl(i);tp(i)};
pl.appendChild(d);
});
document.getElementById('tc').textContent=PARTS.length;document.getElementById('vc').textContent=PARTS.length;
</script>
</body>
</html>
