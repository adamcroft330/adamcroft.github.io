<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Eval | Themis</title>
    <style>
        html, body { margin: 0; height: 100%; background: #08090c; overflow: hidden; }
        /* The renderer draws at a fixed 3:2, so the stage is the largest 3:2 box that fits. */
        #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                 width: min(100vw, 150vh); height: min(100vh, 66.667vw); }
        canvas.emscripten { display: block; width: 100% !important; height: 100% !important; background: #08090c; outline: none; }
        #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
                   color: #777; font: 12px ui-monospace, Menlo, monospace; background: #08090c; }
        #spin { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #4aa829; border-radius: 50%; animation: s .8s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
        #status { font-size: 11px; color: #555; min-height: 14px; }
        #tag { position: absolute; right: 10px; bottom: 8px; font: 11px ui-monospace, Menlo, monospace; color: rgba(255,255,255,0.35); }
        #tag a { color: inherit; text-decoration: none; }
        #tag a:hover { color: rgba(255,255,255,0.85); }
    </style>
</head>
<body>
    <div id="stage">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        <div id="loading"><div id="spin"></div><div>compiling environment…</div><div id="status"></div></div>
        <div id="tag"><a href="/themis/">← Themis</a> · <span id="policy">policy: loading…</span></div>
    </div>
    <script>
        fetch('POLICY.txt').then(r => r.ok ? r.text() : 'policy: unknown').then(t => { document.getElementById('policy').textContent = t.trim(); }).catch(() => {});
        var statusEl = document.getElementById('status');
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function (text) { if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' '); console.log(text); },
            printErr: function (text) { console.warn(text); },
            setStatus: function (t) { if (t) statusEl.textContent = t; },
            onRuntimeInitialized: function () { var l = document.getElementById('loading'); if (l) l.remove(); Module.canvas.focus(); }
        };
        document.getElementById('canvas').addEventListener('keydown', function (e) { if ([' ', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault(); });
    </script>
    <script async src="game.js"></script>
</body>
</html>
